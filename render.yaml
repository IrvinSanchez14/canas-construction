# Render Blueprint - Infrastructure as Code
# https://render.com/docs/blueprint-spec
#
# Flujo de deploy automático:
# - Push a branch "dev" → despliega en ambiente development
# - Push a branch "main" → despliega en ambiente production

# ============== DATABASES ==============
databases:
  # Database para Development
  - name: canas-db-dev
    databaseName: canas_dev
    user: canas_user
    plan: free
    region: oregon

  # Database para Production
  - name: canas-db-prod
    databaseName: canas_prod
    user: canas_user
    plan: free
    region: oregon

# ============== SERVICES ==============
services:
  # --------- DEVELOPMENT ---------
  - type: web
    name: canas-api-dev
    runtime: docker
    plan: free
    region: oregon
    branch: dev  # Deploy automático cuando haces push a "dev"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: canas-db-dev
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: development
      - key: DEBUG
        value: "True"
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","https://tu-frontend-dev.com"]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALGORITHM
        value: HS256

  # --------- PRODUCTION ---------
  - type: web
    name: canas-api-prod
    runtime: docker
    plan: free
    region: oregon
    branch: main  # Deploy automático cuando haces push a "main"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: canas-db-prod
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: '["https://tu-frontend-prod.com"]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALGORITHM
        value: HS256
