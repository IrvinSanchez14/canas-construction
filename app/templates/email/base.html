<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notification{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f0f4f8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
    <!-- Outer wrapper for centering -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f4f8;">
        <tr>
            <td align="center" style="padding:40px 16px;">

                <!-- Main card -->
                <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.08);">

                    <!-- Logo / Header -->
                    <tr>
                        <td align="center" style="background-color:#ffffff; padding:32px 40px; border-bottom:3px solid #3b82f6;">
                            {% if company_logo_url %}
                            <img src="{{ company_logo_url }}" alt="{{ company_name }}" width="180" style="display:block; max-width:180px; height:auto;" />
                            {% else %}
                            <h1 style="margin:0; color:#1e293b; font-size:22px; font-weight:700; letter-spacing:0.5px;">
                                {{ company_name }}
                            </h1>
                            {% endif %}
                        </td>
                    </tr>

                    <!-- Content area -->
                    <tr>
                        <td style="padding:32px 40px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:20px 40px; background-color:#f8fafc; border-top:1px solid #e2e8f0;">
                            <p style="margin:0 0 4px; font-size:12px; color:#94a3b8; text-align:center;">
                                This is an automated notification from {{ company_name }}.
                            </p>
                            <p style="margin:0; font-size:12px; color:#94a3b8; text-align:center;">
                                To stop receiving these, contact your administrator.
                            </p>
                        </td>
                    </tr>

                </table>
                <!-- /Main card -->

            </td>
        </tr>
    </table>
</body>
</html>
